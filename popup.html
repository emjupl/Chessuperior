<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup-style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="content">
        <div class="header">
            <span><b>Chessuperior</b></span>
        </div>
        <div class="main">
            <div class="radiosContainer">
                <span><b>Wybierz sposób analizy</b></span>
                <ul>
                    <li>
                        <label class="radio-label" for="lichess-radio">
                            <input type="radio" name="website-for-analysis" id="lichess-radio" value="lichess"
                                checked>Lichess</label>
                    </li>
                    <li>
                        <label class="radio-label" for="custom-domain-radio">
                            <input type="radio" name="website-for-analysis" id="custom-domain-radio"
                                value="custom-domain">Niestandardowa domena
                            <input type="text" name="custom-domain-textbox" id="custom-domain-textbox"
                                placeholder="ex. 6chess.com/..." value="" hidden>
                        </label>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
